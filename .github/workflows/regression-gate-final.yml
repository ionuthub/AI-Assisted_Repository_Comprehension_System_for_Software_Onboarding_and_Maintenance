name: Final artefact regression gate

on:
  push:
    branches: [ run/regression-gate-final ]
    paths:
      - .github/workflows/regression-gate-final.yml

permissions:
  contents: write

jobs:
  capture:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/regression-gate-final
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Align gate harness with final Answers UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('analysis/capture_gate.mjs')
          text = path.read_text()

          old = '''for (const { id, question } of questions) {
            process.stdout.write(`Q${id} … `);
            await page.fill("#workspace-ask", question);
            await page.press("#workspace-ask", "Enter");

            const answerPanel = page.locator('p:text-is("Your question") + h1 + div:not([aria-busy])').first();'''
          new = '''for (const { id, question } of questions) {
            process.stdout.write(`Q${id} … `);

            // The final interface exposes repository Q&A under the Answers workspace tab.
            // The first question and follow-up questions use separate accessible inputs.
            let questionInput = page.locator('#repository-question');
            if ((await questionInput.count()) === 0) {
              const followUp = page.locator('#repository-question-follow-up');
              if ((await followUp.count()) === 0) {
                await page.getByRole('button', { name: 'Answers' }).click();
                questionInput = page.locator('#repository-question');
                await questionInput.waitFor();
              } else {
                questionInput = followUp;
              }
            }
            await questionInput.fill(question);
            await questionInput.press('Enter');

            const answerPanel = page.locator('[data-generation-status]').first();'''
          if old not in text:
              raise SystemExit('Could not find the legacy Q&A selector block to patch')
          text = text.replace(old, new)

          old_parser = '''    const text = (await row.innerText()).replace(/\\s+/g, " ").trim();
              // "1 src/path/file.ts 0.27", rank, path, then the score as rendered.
              const m = text.match(/^(\\d+)\\s+(\\S+)\\s+([\\d.]+)$/);
              retrieved.push(m ? { rank: +m[1], path: m[2], score: +m[3] } : { raw: text });'''
          new_parser = '''    const text = (await row.innerText()).replace(/\\s+/g, " ").trim();
              // Final UI also renders the retrieval-reason label between path and score.
              // Parse rank + path + trailing numeric score while allowing that label.
              const m = text.match(/^(\\d+)\\s+(\\S+).*?([\\d.]+)$/);
              retrieved.push(m ? { rank: +m[1], path: m[2], score: +m[3] } : { raw: text });'''
          if old_parser not in text:
              raise SystemExit('Could not find the legacy evidence-row parser to patch')
          text = text.replace(old_parser, new_parser)

          path.write_text(text)
          PY

      - name: Prepare clean regression gates
        run: |
          mkdir -p study/regression-final
          python3 - <<'PY'
          import json
          from pathlib import Path

          for repo in ('clinic-triage', 'warehouse-dispatch'):
              src = Path(f'study/accuracy-gate.{repo}.json')
              dst = Path(f'study/regression-final/accuracy-gate.{repo}.json')
              gate = json.loads(src.read_text())
              for item in gate['items']:
                  for key in list(item):
                      if key.startswith('tool') or key == 'correct':
                          item.pop(key, None)
              gate['date'] = ''
              gate.pop('capturedAt', None)
              gate.pop('capturedFrom', None)
              gate.pop('capturedRepository', None)
              gate.pop('groundTruthProvenance', None)
              dst.write_text(json.dumps(gate, indent=1, ensure_ascii=False) + '\n')
          PY

      - name: Capture clinic gate
        run: |
          node analysis/capture_gate.mjs \
            --repo https://github.com/ionuthub/clinic-triage \
            --gate study/regression-final/accuracy-gate.clinic-triage.json \
            --truth study/ground-truth.clinic-triage.md \
            --accept-tool-verified \
            --url https://repo-comprehension-system.vercel.app/ \
            --tool-version 3554f787

      - name: Avoid API rate-window overlap
        run: sleep 65

      - name: Capture warehouse gate
        run: |
          node analysis/capture_gate.mjs \
            --repo https://github.com/ionuthub/warehouse-dispatch \
            --gate study/regression-final/accuracy-gate.warehouse-dispatch.json \
            --truth study/ground-truth.warehouse-dispatch.md \
            --accept-tool-verified \
            --url https://repo-comprehension-system.vercel.app/ \
            --tool-version 3554f787

      - name: Build bound marking sheets
        run: |
          python3 analysis/marking_sheet.py build \
            study/regression-final/accuracy-gate.clinic-triage.json \
            study/ground-truth.clinic-triage.md
          python3 analysis/marking_sheet.py build \
            study/regression-final/accuracy-gate.warehouse-dispatch.json \
            study/ground-truth.warehouse-dispatch.md

      - name: Preserve regression screenshots only
        run: |
          mkdir -p study/regression-final/screenshots
          cp study/gate-screenshots/clinic-triage-q*.png study/regression-final/screenshots/
          cp study/gate-screenshots/warehouse-dispatch-q*.png study/regression-final/screenshots/
          git checkout -- study/gate-screenshots

      - name: Commit regression evidence to run branch
        run: |
          git config user.name "Ionut Dobrin"
          git config user.email "48881729+ionuthub@users.noreply.github.com"
          git add study/regression-final
          git commit -m "Capture final artefact regression gate [skip ci]"
          git push origin HEAD:run/regression-gate-final